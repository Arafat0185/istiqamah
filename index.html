<html lang="en">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#0a0d11">
<meta name="mobile-web-app-capable" content="yes">

<title>Istiqamah</title>
<style>
:root{--bg:#0a0d11;--ink:#e4ebf2;--muted:#5d6b78;--line:#1a222b;--ice:#a9d3f0;--green:#5fbf92;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:300 18px/1.45 "Helvetica Neue",Helvetica,"Segoe UI",system-ui,sans-serif;min-height:100vh}
main{max-width:480px;margin:0 auto;padding:56px 24px 80px}
.date{color:var(--muted);font-size:.85rem;letter-spacing:.04em;margin:0 0 6px}
h1{font-weight:200;font-size:2.6rem;letter-spacing:-.03em;margin:0 0 28px}
.brand{display:flex;align-items:center;gap:14px;margin:0 0 28px}
.brand h1{margin:0}
.brand svg{width:38px;height:34px;flex:none}
.navlink{display:inline-block;margin:0 0 18px;color:var(--ice);font-size:.9rem;text-decoration:none;letter-spacing:.03em}
.quote{margin:0 0 34px;padding-left:16px;border-left:1px solid var(--ice)}
.quote p{margin:0;font-size:1.05rem;line-height:1.55}
.quote small{display:block;margin-top:8px;color:var(--muted);font-size:.8rem}
.prog{display:flex;justify-content:space-between;color:var(--ice);font-size:.9rem;margin-bottom:10px}
.bar{height:2px;background:var(--line);margin-bottom:8px;transition:box-shadow .5s}
.bar i{display:block;height:100%;width:0;background:var(--ice);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.full{box-shadow:0 0 14px rgba(169,211,240,.7)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
li.grp{display:block;border:0;padding:26px 0 4px;color:var(--muted);font-size:.82rem;letter-spacing:.03em}
.box{position:relative;width:24px;height:24px;flex:none;border:1px solid var(--muted);border-radius:50%;background:none;cursor:pointer;padding:0;display:grid;place-items:center;transition:background .25s,border-color .25s}
.box:hover{border-color:var(--ice)}
li.done .box{background:var(--ice);border-color:var(--ice)}
.box svg{width:12px;height:12px;fill:none;stroke:var(--bg);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:14;stroke-dashoffset:14}
li.done .box svg{stroke-dashoffset:0}
.box::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:1px solid var(--ice);opacity:0;pointer-events:none}
li.pop .box{animation:pop .5s cubic-bezier(.3,1.7,.5,1)}
li.pop .box svg{animation:draw .35s .1s ease-out backwards}
li.pop .box::after{animation:ring .7s ease-out}
li.pop .name{animation:fade .5s ease-out}
.p{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:var(--ice);pointer-events:none;animation:fly .65s ease-out forwards}
@keyframes pop{0%{transform:scale(.7)}55%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:14}}
@keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.8)}}
@keyframes fly{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}}
@keyframes fade{from{color:var(--ice)}}
.txt{flex:1;min-width:0}
.name{display:block;overflow-wrap:anywhere;transition:color .3s}
li.done .name{color:var(--muted)}
.meta{display:flex;align-items:center;gap:10px;margin-top:5px;font-size:.78rem;color:var(--muted)}
.dots{display:flex;gap:4px}
.dots b{width:6px;height:6px;border-radius:50%;border:1px solid var(--muted)}
.dots b.on{background:var(--ice);border-color:var(--ice)}
.del{border:0;background:none;color:var(--muted);font:inherit;font-size:1.2rem;cursor:pointer;padding:2px 6px}
.del:hover{color:var(--ice)}
.add{margin-top:18px}
.add input{width:100%;font:inherit;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;border-radius:0}
.add input::placeholder{color:var(--muted)}
.add input:focus{outline:0;border-color:var(--ice)}
.edit{margin-top:28px;border:0;background:none;color:var(--muted);font:inherit;font-size:.85rem;letter-spacing:.04em;cursor:pointer;padding:6px 0}
.edit:hover{color:var(--ice)}
.rem{margin-top:26px}
.remt{color:var(--muted);font-size:.82rem;letter-spacing:.03em;margin:0 0 10px}
.times{display:flex;gap:10px;flex-wrap:wrap}
.times input{font:inherit;font-size:.95rem;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--line);padding:8px 2px;width:96px;color-scheme:dark}
.rbtns{display:flex;gap:18px;margin-top:14px}
.rbtns button{border:0;background:none;color:var(--ice);font:inherit;font-size:.88rem;cursor:pointer;padding:6px 0}
.rs{color:var(--muted);font-size:.82rem;margin:8px 0 0;min-height:1.2em}
[hidden]{display:none!important}
button:focus-visible{outline:1px solid var(--ice);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}

#hz .date{color:var(--muted);font-size:.85rem;letter-spacing:.04em;margin:14px 0 4px}
#hz h1{font-weight:200;font-size:2.4rem;letter-spacing:-.03em;margin:0 0 20px}
#hz h2{font-weight:300;font-size:.8rem;color:var(--muted);letter-spacing:.06em;margin:28px 0 8px}
#hz .tabs{display:flex;gap:26px;margin:0 0 22px;border-bottom:1px solid var(--line)}
#hz .tabs button{border:0;background:none;color:var(--muted);font:inherit;font-size:.95rem;padding:8px 0;cursor:pointer;border-bottom:1px solid transparent;margin-bottom:-1px}
#hz .tabs button.on{color:var(--ice);border-color:var(--ice)}
#hz .hero{display:flex;align-items:center;gap:22px;margin:0 0 14px}

#hz .ring circle+circle{animation:rg .9s cubic-bezier(.2,.8,.2,1)}
#hz .ring.ok{filter:drop-shadow(0 0 7px rgba(95,191,146,.55))}
@keyframes rg{from{stroke-dashoffset:var(--c)}}
#hz .hero b{display:block;font-weight:200;font-size:2.6rem;line-height:1;color:var(--ice)}
#hz .hero span{font-size:.8rem;color:var(--muted)}
#hz .dots2{display:flex;gap:6px;margin:0 0 16px}
#hz .dots2 i{width:8px;height:8px;border-radius:50%;border:1px solid var(--muted)}
#hz .dots2 i.on{background:var(--green);border-color:var(--green)}
#hz .msg{margin:0;padding-left:14px;border-left:1px solid var(--ice)}
#hz small,#hz .mut{color:var(--muted);font-size:.8rem}
#hz .mut{margin:10px 0}
#hz .lc{border:1px solid var(--line);border-radius:16px;padding:18px;margin:4px 0 10px}
#hz .lc.slide{animation:sl .45s ease-out}
@keyframes sl{from{opacity:0;transform:translateX(16px)}}
#hz .lc select{width:100%;margin-bottom:14px}
#hz .nm{font-size:1.3rem;font-weight:300;margin:0}
#hz .pb{height:3px;background:var(--line);border-radius:2px;margin:10px 0}
#hz .pb i{display:block;height:100%;background:var(--ice);border-radius:2px;transition:width .5s}
#hz .quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
#hz .b{border:1px solid var(--line);background:none;color:var(--ice);font:inherit;font-size:.9rem;padding:9px 16px;border-radius:999px;cursor:pointer;transition:transform .15s}
#hz .b.on{background:var(--ice);color:var(--bg);border-color:var(--ice)}
#hz .b.big{padding:12px 34px;font-size:1rem}
#hz .b:active{transform:scale(.93)}
#hz .tip{margin:28px 0 0;color:var(--muted);font-size:.9rem;line-height:1.6}
#hz .step{display:flex;align-items:center;gap:14px;margin-bottom:6px}
#hz .step b{font-weight:200;font-size:1.8rem;color:var(--ice);min-width:1.6em;text-align:center}
#hz .step span{color:var(--muted);flex:1}
#hz .set{display:flex;flex-direction:column;gap:12px;margin-top:10px}
#hz .set label{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--muted);gap:12px}
#hz select,#hz input{font:inherit;font-size:.95rem;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--line);padding:8px 2px;border-radius:0;color-scheme:dark}
#hz select option{background:#10161c}
#hz input:focus,#hz select:focus{outline:0;border-color:var(--ice)}
#hz .num{width:80px;text-align:center}
#hz .jgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#hz .jb{border:1px solid var(--line);border-radius:16px;background:#0d1217;padding:12px;min-height:150px;display:flex;flex-direction:column;gap:10px;transition:border-color .3s,box-shadow .3s}
#hz .jb.in{animation:pin .5s cubic-bezier(.3,1.4,.5,1) backwards;animation-delay:calc(var(--i)*25ms)}
#hz .jb.full{background:linear-gradient(160deg,#10301f,#0b1812);border-color:var(--green);box-shadow:0 0 18px rgba(95,191,146,.22)}
#hz .jh{display:flex;justify-content:space-between;align-items:baseline;font-size:.78rem;color:var(--muted)}
#hz .jh b{font-weight:300;color:var(--ink);font-size:.95rem}
#hz .jb.full .jh b,#hz .jb.full .jh span{color:var(--green)}
#hz .cg{display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start;margin:auto 0}
#hz .cl{width:var(--c);height:var(--c);font-size:max(8px,calc(var(--c)*.38));border-radius:4px;border:1px solid #1f2a34;background:#0a0f13;color:#3d4b57;padding:0;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#hz .cl:active{transform:scale(.85)}
#hz .cl.p{color:#dbeaf6;text-shadow:0 0 3px #000}
#hz .cl.f{background:var(--green);border-color:var(--green);color:#0a0d11;font-weight:600}
#hz .cl.cur{outline:1px solid #5d86a3;outline-offset:1px;animation:cur 1.8s ease-in-out infinite}
#hz .cel{animation:cel .9s ease-out}
@keyframes pin{from{opacity:0;transform:scale(.88)}}
@keyframes cel{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(95,191,146,.8)}40%{transform:scale(1.1)}100%{transform:scale(1);box-shadow:0 0 0 22px rgba(95,191,146,0)}}
@keyframes cur{50%{outline-color:transparent}}
#hz .sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:20}
#hz .sheet[hidden]{display:none}
#hz .card{max-height:88vh;overflow-y:auto;width:100%;max-width:480px;margin:0 auto;background:#10161c;border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px))}
#hz .card h3{margin:0 0 4px;font-weight:300;font-size:1.3rem}
#hz .seg3{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
#hz .ay{display:grid;grid-template-columns:repeat(auto-fill,minmax(26px,1fr));gap:3px;margin:12px 0}
#hz .ac{height:26px;border-radius:4px;border:1px solid #1f2a34;background:#0a0f13;color:#4b5a66;font:inherit;font-size:.62rem;padding:0;cursor:pointer;transition:transform .12s}
#hz .ac:active{transform:scale(.85)}
#hz .ac.f{background:var(--green);border-color:var(--green);color:#0a0d11;font-weight:600}
#hz .ac.nx{outline:1px solid var(--ice);outline-offset:1px;color:var(--ice)}
#hz .toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#10301f;border:1px solid var(--green);color:#d9f5e7;padding:11px 20px;border-radius:999px;font-size:.9rem;z-index:30;pointer-events:none;animation:toast 3.4s forwards;white-space:nowrap}
#hz .toast[hidden]{display:none}
@keyframes toast{0%{opacity:0;transform:translate(-50%,12px)}10%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}
#hz svg text{font-family:inherit}
#hz button:focus-visible{outline:1px solid var(--ice);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#hz .hero{position:relative}
#hz .hero small{display:block}
#hz .pt{position:absolute;left:48px;top:48px;width:5px;height:5px;margin:-2px;border-radius:50%;background:var(--ice);animation:hfly .8s ease-out forwards;pointer-events:none}
#hz .pt:nth-child(3n){background:var(--green)}
@keyframes hfly{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}}
#hz .quick{position:relative}
#hz .fl{position:absolute;right:2px;top:-14px;color:var(--green);font-size:1.15rem;animation:flt 1s ease-out forwards;pointer-events:none}
@keyframes flt{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-28px)}}
#hz .why{margin:10px 0 0;color:var(--muted);font-style:italic;font-size:.9rem}
#hz .msg.ok{border-color:var(--green);color:#d9f5e7}
#hz .rs{display:flex;flex-wrap:wrap;gap:3px;margin:12px 0 4px}
#hz .rs i{width:8px;height:8px;border-radius:2px;border:1px solid #26313b}
#hz .rs i.on{background:var(--green);border-color:var(--green)}
#hz .rs i.cur{border-color:var(--ice);background:rgba(169,211,240,.25)}
#hz .set input{width:100%}
@media (prefers-reduced-motion:reduce){.fl,.pt{display:none}}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(10,13,17,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:10}
.nav button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:.72rem;letter-spacing:.05em;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 0;transition:color .2s}
.nav button.on{color:var(--ice)}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

#hz .cl{position:relative;overflow:hidden}
#hz .cl i{position:absolute;left:0;right:0;bottom:0;background:#3b6f93}
#hz .cl span{position:relative}
#hz .cl.cur{outline:none;animation:none;box-shadow:0 0 0 1.5px #7fa6c4}
#hz .rv{position:relative;overflow:hidden}
#hz .fin{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(14,40,28,.95);animation:fo .25s ease-out;z-index:2}
#hz .fin svg{width:64px;height:64px;overflow:visible}

#hz .fin span{color:#d9f5e7;font-size:.9rem;opacity:0;animation:fo2 .3s .55s forwards}
#hz .fin b{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-40px 0 0 -32px;border-radius:50%;border:2px solid #5fbf92;opacity:0;animation:rp .8s .3s ease-out forwards}
#hz .fin i{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-10px 0 0 -2px;border-radius:50%;background:#5fbf92;opacity:0;animation:hfly .8s .35s ease-out forwards}
#hz .rs i.pop{animation:sq .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes fo{from{opacity:0}}
@keyframes fo2{to{opacity:1}}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes rp{from{transform:scale(1);opacity:.8}to{transform:scale(3.4);opacity:0}}

@media (prefers-reduced-motion:reduce){#hz .fin circle,#hz .fin path{stroke-dashoffset:0}#hz .fin span{opacity:1}#hz .fin i,#hz .fin b{display:none}}

.nav button{position:relative}

#rf h1{font-weight:200;font-size:2.4rem;letter-spacing:-.03em;margin:0 0 20px}

<body>
<main>
<div id="hb">
<p class="date" id="date"></p>
<div class="brand"><svg viewBox="0 0 40 36" aria-hidden="true"><path d="M2 32H13V20H24V8H35" fill="none" stroke="#a9d3f0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="35" cy="8" r="3" fill="#a9d3f0"/></svg><h1>Istiqamah</h1></div>
<blockquote class="quote"><p id="qt"></p><small id="qs"></small></blockquote>
<div class="prog"><span id="pt"></span><span id="ps"></span></div>

<p class="remt" style="margin-top:28px">Backup</p><div class="rbtns"><button id="bon">Turn on cloud backup</button><button id="bnow" hidden>Back up now</button><button id="bshow" hidden>Show my code</button><button id="bcopy">Copy backup</button></div><p class="rs" id="bs"></p>
<textarea id="brest" class="bta" rows="2" placeholder="To restore, paste your sync code or a copied backup here"></textarea><div class="rbtns"><button id="brestore">Restore</button></div></div>
<button class="edit" id="edit">Edit habits</button>
</div>
<div id="hz" hidden>
<p class="date" id="hdate"></p>
<h1>Hifz</h1>

function post(p,b){return fetch(API+p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)})}
function btns(){var c=code();$("bon").hidden=!!c;$("bnow").hidden=!c;$("bshow").hidden=!c}
function stat(){var c=code(),t=gi("bktime");say(!ok?"Add your Worker address in config.js to use cloud backup.":c?"Cloud backup is on. Last backup: "+(t?new Date(t).toLocaleString():"not yet"):"Cloud backup is off. Turn it on so you can restore everything if you delete the app.")}
async function push(force){var c=code();if(!c||!ok)return false;var s=snap(),h=JSON.stringify(s.data);if(!force&&h===gi("bkhash"))return true;
try{var r=await post("/backup",{code:c,data:s});if(!r.ok)return false;localStorage.setItem("bkhash",h);localStorage.setItem("bktime",s.t);return true}catch(e){return false}}
$("bon").onclick=async function(){if(!ok){stat();return}var a=new Uint8Array(16);crypto.getRandomValues(a);var c=[].map.call(a,function(x){return("0"+x.toString(16)).slice(-2)}).join("");
localStorage.setItem("synccode",c);localStorage.removeItem("bkhash");var g=await push(true);
if(g){btns();say("Cloud backup is on.\nYour sync code, save it in Notes. You need it to restore:\n"+c)}else{localStorage.removeItem("synccode");say("Could not reach your Worker. Paste the new worker.js into Cloudflare, deploy, and try again.")}};
$("bnow").onclick=async function(){var g=await push(true);say(g?"Backed up just now.":"Backup failed. Check your connection and Worker.");if(g)setTimeout(stat,2500)};
$("bshow").onclick=function(){say("Your sync code:\n"+code()+"\nKeep it somewhere safe.")};
$("bcopy").onclick=function(){try{navigator.clipboard.writeText(JSON.stringify(snap()));say("Backup copied. Paste it into Notes to keep a copy.")}catch(e){say("Copy is not available here.")}};
$("brestore").onclick=async function(){var v=$("brest").value.trim();if(!v){say("Paste your sync code or a copied backup first.");return}var s=null,fromCode=v.charAt(0)!="{";
try{if(!fromCode)s=JSON.parse(v);else{if(!ok){say("Add your Worker address in config.js first.");return}var r=await post("/restore",{code:v});if(r.status==404){say("No backup found for that code.");return}if(!r.ok)throw 0;s=(await r.json()).data}}catch(e){say("Could not read that backup.");return}
if(!s||!s.data){say("That does not look like a backup.");return}
if(!confirm("Replace the data on this device with this backup?"))return;
KEYS.forEach(function(k){if(s.data[k]!=null)localStorage.setItem(k,s.data[k])});if(fromCode)localStorage.setItem("synccode",v);localStorage.removeItem("bkhash");location.reload()};
document.addEventListener("visibilitychange",function(){if(document.hidden)push(false)});setInterval(function(){if(!document.hidden)push(false)},60000);setTimeout(function(){push(false)},4000);
btns();stat();window.bkPush=push;
})();</script>
<script>(function(){var nav=document.getElementById("nav"),S={habits:document.getElementById("hb"),hifz:document.getElementById("hz"),reflect:document.getElementById("rf")};
function show(t){if(!S[t])t="habits";Object.keys(S).forEach(function(k){S[k].hidden=k!=t});[].forEach.call(nav.children,function(b){b.classList.toggle("on",b.dataset.t==t)});try{localStorage.setItem("apptab",t)}catch(e){}
if(t=="habits"&&window.hbRefresh)window.hbRefresh();if(t=="hifz"&&window.hzRefresh)window.hzRefresh();if(t=="reflect"&&window.rfRefresh)window.rfRefresh();if(window.rfDot)window.rfDot();window.scrollTo(0,0);try{history.replaceState(null,"","#"+t)}catch(e){}}
nav.addEventListener("click",function(e){var b=e.target.closest("button");if(b)show(b.dataset.t)});
var st=null;try{st=localStorage.getItem("apptab")}catch(e){}
show(location.hash?location.hash.slice(1):st||"habits");
var d0=new Date().toDateString();document.addEventListener("visibilitychange",function(){if(!document.hidden&&new Date().toDateString()!==d0)location.reload()})})();</script>
