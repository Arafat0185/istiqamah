.step b{font-weight:200;font-size:1.8rem;color:var(--ice);min-width:1.6em;text-align:center}

.num{width:80px;text-align:center}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:20}
.sheet[hidden]{display:none}
.card{max-height:88vh;overflow-y:auto;width:100%;max-width:480px;margin:0 auto;background:#10161c;border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px))}
.card h3{margin:0 0 4px;font-weight:300;font-size:1.3rem}
.seg3{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.ay{display:grid;grid-template-columns:repeat(auto-fill,minmax(26px,1fr));gap:3px;margin:12px 0}
.ac{height:26px;border-radius:4px;border:1px solid #1f2a34;background:#0a0f13;color:#4b5a66;font:inherit;font-size:.62rem;padding:0;cursor:pointer;transition:transform .12s}
.ac:active{transform:scale(.85)}
.ac.f{background:var(--green);border-color:var(--green);color:#0a0d11;font-weight:600}
.ac.nx{outline:1px solid var(--ice);outline-offset:1px;color:var(--ice)}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#10301f;border:1px solid var(--green);color:#d9f5e7;padding:11px 20px;border-radius:999px;font-size:.9rem;z-index:30;pointer-events:none;animation:toast 3.4s forwards;white-space:nowrap}
.toast[hidden]{display:none}
@keyframes toast{0%{opacity:0;transform:translate(-50%,12px)}10%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}
svg text{font-family:inherit}
button:focus-visible{outline:1px solid var(--ice);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

a.forEach(function(o){var mm=segM(o),p=mm/o.tot*100,part=mm>0&&mm<o.tot;h+='<button class="cl'+(mm==o.tot?" f":part?" p":"")+(D.cur==o.sn?" cur":"")+(CEL["s"+o.k]?" cel":"")+'" data-a="seg" data-k="'+o.k+'"'+(part?' style="background:linear-gradient(to top,#3b6f93 '+p+'%,#0a0f13 '+p+'%)"':"")+'>'+o.sn+'</button>'});
h+='</div></div>'}
return'<p class="mut">'+full+' of 30 juz complete · '+total().toLocaleString()+' of '+ALL.toLocaleString()+' ayat. Tap a surah to edit it.</p><div class="jgrid">'+h+'</div>'}
function dl(x){return new Date(x*864e5).toLocaleDateString(undefined,{day:"numeric",month:"short",timeZone:"UTC"})}
function vProg(){var tt=total(),ev=Object.keys(D.add).filter(function(k){return D.add[k]>0}).sort(),sa=0,W=320,H=120,i,j,k;ev.forEach(function(k){sa+=D.add[k]});
var c=tt-sa,st=c,x0=ev.length?num(ev[0]):T-1,x1=Math.max(T,x0+1),pts=[[0,c]];ev.forEach(function(k){c+=D.add[k];pts.push([(num(k)-x0)/(x1-x0),c])});pts.push([1,c]);
var y0=Math.max(0,Math.floor(st/10)*10),y1=Math.max(y0+10,Math.ceil(c/10)*10),P=pts.map(function(p){return(30+p[0]*(W-36)).toFixed(1)+","+(H-16-(p[1]-y0)/(y1-y0)*(H-26)).toFixed(1)}).join(" ");
var h='<p class="msg">'+tt.toLocaleString()+' of '+ALL.toLocaleString()+' ayat · '+(tt/ALL*100).toFixed(1)+'%</p><h2>TOTAL AYAT MEMORISED</h2><svg viewBox="0 0 '+W+' '+(H+4)+'" width="100%"><polygon points="30,'+(H-16)+' '+P+' '+(W-6)+','+(H-16)+'" fill="#a9d3f0" opacity=".1"/><polyline points="'+P+'" fill="none" stroke="#a9d3f0" stroke-width="1.6" stroke-linejoin="round"/><text x="0" y="14" '+tx+'>'+y1+'</text><text x="0" y="'+(H-14)+'" '+tx+'>'+y0+'</text><text x="30" y="'+(H+2)+'" '+tx+'>'+dl(x0)+'</text><text x="'+(W-6)+'" y="'+(H+2)+'" '+tx+' text-anchor="end">Today</text></svg>';
var arr=[],ma=[],mx=Math.max(D.goal,1);for(i=36;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);arr.push(D.add[iso(d)]||0)}
for(k=7;k<37;k++){var t=0;for(j=k-6;j<=k;j++)t+=arr[j];ma.push(t/7);mx=Math.max(mx,arr[k],t/7)}
var bars="",line=[],w7=0,a30=0,best=0;for(k=0;k<30;k++){var v=arr[k+7],hh=v/mx*56;a30+=v;best=Math.max(best,v);if(k>=23)w7+=v;bars+='<rect x="'+(k*10.4+2)+'" y="'+(66-hh)+'" width="8" height="'+Math.max(hh,1)+'" rx="2" fill="'+(v?"#a9d3f0":"#1a222b")+'"/>';line.push((k*10.4+6).toFixed(1)+","+(66-ma[k]/mx*56).toFixed(1))}
var gy=66-D.goal/mx*56;
h+='<h2>NEW AYAT PER DAY, WITH 7-DAY TREND</h2><svg viewBox="0 0 320 84" width="100%">'+bars+'<line x1="0" x2="320" y1="'+gy+'" y2="'+gy+'" stroke="#5d6b78" stroke-dasharray="3 3" stroke-width=".7"/><polyline points="'+line.join(" ")+'" fill="none" stroke="#5fbf92" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><text x="2" y="80" '+tx+'>30 days ago</text><text x="314" y="80" '+tx+' text-anchor="end">Today</text></svg><p class="mut">Last 7 days: '+w7+' ayat ('+(w7/7).toFixed(1)+' a day) · last 30 days: '+a30+' · best day: '+best+'. The green line is your 7-day average and the dashed line is your goal.</p>';
if(a30>0){var dy=(ALL-tt)/(a30/30);h+='<p class="mut">At this pace: about '+(dy<700?Math.max(1,Math.round(dy/30))+" months":(dy/365).toFixed(1)+" years")+' to finish.</p>'}
return h}
function vSheet(k){var o=SEG.filter(function(x){return x.k==k})[0];if(!o)return"";var n=mem(o.sn),m=segM(o),c="";
for(var a=o.st;a<=o.en;a++)c+='<button class="ac'+(a<=n?" f":"")+(a==n+1?" nx":"")+'" data-a="ay" data-s="'+o.sn+'" data-k="'+a+'">'+a+'</button>';
return'<div class="card" data-a="noop"><h3>'+esc(o.name)+(o.rng?" "+o.rng:"")+'</h3><small>'+m+' of '+o.tot+' ayat memorised</small><div class="ay">'+c+'</div><small>Tap an ayah to mark everything up to it as memorised. Tap the last filled one again to undo it. The outlined square is your next ayah.</small><div class="seg3"><label class="mut">Memorised up to ayah <input class="num" id="sn" type="number" inputmode="numeric" min="0" max="'+CNT[o.sn-1]+'" value="'+n+'"></label><button class="b on" data-a="save" data-s="'+o.sn+'">Save</button></div><button class="b" data-a="scur" data-s="'+o.sn+'">Learn this surah</button> '+(revList().indexOf(o.sn)>-1?'<button class="b" data-a="rnow" data-s="'+o.sn+'">Revise this next</button> ':"")+'<button class="b" data-a="close">Close</button></div>'}
function render(){document.getElementById("tabs").innerHTML=[["today","Today"],["map","Map"],["prog","Progress"]].map(function(t){return'<button data-a="tab" data-k="'+t[0]+'" class="'+(tab==t[0]?"on":"")+'">'+t[1]+'</button>'}).join("");
document.getElementById("v").innerHTML=({today:vToday,map:vMap,prog:vProg})[tab]();
var sh=document.getElementById("sh"),old=sh.firstElementChild,st=old?old.scrollTop:0;sh.hidden=!sk;sh.innerHTML=sk?vSheet(sk):"";var nw=sh.firstElementChild;if(nw&&st)nw.scrollTop=st;anim=0;CEL={};RA=0}
document.addEventListener("click",function(e){if(/^(SELECT|INPUT|OPTION)$/.test(e.target.tagName))return;var t=e.target.closest("[data-a]");if(!t)return;var a=t.dataset.a,k=t.dataset.k,d=t.dataset;
if(a=="noop")return;
if(a=="tab"){tab=k;anim=(k=="map")}else if(a=="seg")sk=k;else if(a=="close")sk=null;
else if(a=="addv"){buzz(10);chg(function(){addV(+d.n)})}else if(a=="undo")undo();
else if(a=="rd"){buzz(14);var w=revDone();RA=1;if(w)toast("Round complete, mashaAllah")}
else if(a=="gm")D.goal=Math.max(1,D.goal-1),save();else if(a=="gp")D.goal=Math.min(50,D.goal+1),save();
else if(a=="save"){var s1=+d.s,v1=Math.max(0,Math.min(CNT[s1-1],+document.getElementById("sn").value||0));chg(function(){setMem(s1,v1)});sk=null}
else if(a=="ay"){var s2=+d.s,a2=+k,pm=mem(s2);chg(function(){setMem(s2,a2==pm?a2-1:a2)})}
else if(a=="scur"){D.cur=+d.s;save();sk=null;tab="today"}
else if(a=="rnow"){D.rp=+d.s;save();sk=null;tab="today";RA=1}
render()});
document.addEventListener("change",function(e){var a=e.target.dataset&&e.target.dataset.a,v=+e.target.value;if(a=="cur"){D.cur=v;save();render()}else if(a=="rsel"){D.rp=v;save();RA=1;render()}});
document.getElementById("date").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
if(!D.init)seed();mirror();render();
</script>
