a{color:var(--muted);text-decoration:none;font-size:.85rem;letter-spacing:.03em}

.jt b{font-weight:300;font-size:1.15rem}

.mb{display:flex;gap:1px;width:80%;height:4px}
.mb i{flex:1;border-radius:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 14px;font-size:.74rem;color:var(--muted)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sc{border:1px solid var(--line);border-left-width:3px;background:none;color:var(--ink);border-radius:10px;padding:10px;text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.sc small{font-size:.72rem}
.sc em{font-style:normal;font-size:.72rem}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:20}
.sheet[hidden]{display:none}
.card{max-height:88vh;overflow-y:auto;width:100%;max-width:480px;margin:0 auto;background:#10161c;border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px))}

.add{display:flex;gap:10px;align-items:center;margin:14px 0}

.lc{border:1px solid var(--line);border-radius:14px;padding:16px;margin:4px 0 8px}
.lc select{width:100%;margin-bottom:12px}
.lc .nm{font-size:1.25rem;font-weight:300;margin:0}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.sc .pb{margin:6px 0 2px}
.num{width:90px;text-align:center}
.jgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.jh b{font-weight:300;color:var(--ink);font-size:.95rem}
.jb.full .jh b,.jb.full .jh span{color:#5fbf92}
.cg{flex:1;display:grid;gap:3px;align-content:center}
.cl{aspect-ratio:1;border-radius:4px;border:1px solid #1f2a34;background:#0a0f13;font-size:.55rem;color:#3d4b57;display:grid;place-items:center;padding:0;cursor:pointer;font-family:inherit;transition:transform .15s}
.cl:active{transform:scale(.85)}
.cl.f{color:#0a0d11;font-weight:600;border-color:transparent}
.cl.cur{outline:1px solid #5d86a3;outline-offset:1px;animation:cur 1.8s ease-in-out infinite}
.cel{animation:cel .9s ease-out}

@keyframes cel{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(95,191,146,.8)}40%{transform:scale(1.1)}100%{transform:scale(1);box-shadow:0 0 0 22px rgba(95,191,146,0)}}
@keyframes cur{50%{outline-color:transparent}}
.ay{display:grid;grid-template-columns:repeat(auto-fill,minmax(26px,1fr));gap:3px;margin:12px 0}
.ac{aspect-ratio:1;border-radius:4px;border:1px solid #1f2a34;background:#0a0f13;color:#4b5a66;font:inherit;font-size:.62rem;padding:0;cursor:pointer;transition:transform .12s}
.ac:active{transform:scale(.85)}
.ac.f{color:#0a0d11;font-weight:600;border-color:transparent}
.ac.nx{outline:1px solid var(--ice);outline-offset:1px;color:var(--ice)}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#10301f;border:1px solid #5fbf92;color:#d9f5e7;padding:11px 20px;border-radius:999px;font-size:.9rem;z-index:30;pointer-events:none;animation:toast 3.4s forwards;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,12px)}10%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}
svg text{font-family:inherit}
button:focus-visible{outline:1px solid var(--ice);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

var SO=NAMES.map(function(n,i){return[i+1,(i+1)+". "+n]});
function vToday(){var P=plan(),s=D.cur,n=s?mem(s):0,c=s?CNT[s-1]:0,nt=D.add[TD]||0,g=D.cfg.goal,tt=total(),l=D.adds[D.adds.length-1],h;
h='<div class="stats"><div><b>'+tt.toLocaleString()+'</b><span>ayat memorised</span></div><div><b>'+streak()+'</b><span>day streak</span></div><div><b>'+(tt/ALL*100).toFixed(0)+'%</b><span>of the Qur’an</span></div></div>'+dots()+'<p class="msg">'+esc(msg(P,nt,s&&n>=c))+'</p><h2>LEARN</h2><div class="lc"><select data-a="cur"><option value="0">Choose a surah</option>'+opts(SO,s)+'</select>';
if(s){h+='<p class="nm">'+n+' of '+c+' ayat</p><div class="pb"><i style="width:'+n/c*100+'%"></i></div>';
if(n<c)h+='<small>Next: ayah '+(n+1)+'</small><div class="quick">'+[1,2,3,5].map(function(x){return'<button class="b" data-a="addv" data-n="'+x+'">+'+x+'</button>'}).join("")+(l&&l.d===TD?'<button class="b" data-a="undo">Undo</button>':"")+'</div>';else h+='<small>Surah complete, mashaAllah. Choose your next surah above.</small>'}
h+='<div class="pb" style="margin-top:16px"><i style="width:'+Math.min(100,nt/g*100)+'%"></i></div><small>Today: '+nt+' of '+g+' new ayat</small></div><h2>REVISE</h2>';
P.rows.forEach(function(r){h+=rvRow(r)});
P.cus.forEach(function(c){h+='<div class="row"><i style="background:'+COL[fd(T-num(c.r))]+'"></i><div class="t"><span>'+esc(c.name)+'</span><small>'+esc(c.t)+' · '+(T-num(c.r))+' days ago</small></div><button class="b" data-a="cr" data-k="'+c.k+'">Done</button></div>'});
if(!P.rows.length&&!P.cus.length)h+='<p class="mut">'+(tt?"All revision done for today.":"Nothing to revise yet.")+'</p>';
h+='<p class="mut">Revised today: '+(D.rev[TD]||0)+' of about '+P.q+' ayat</p><p class="tip">'+esc(TIPS[Math.floor(T)%TIPS.length])+'</p><h2>PLAN</h2><div class="set"><label>Daily new ayat goal<select data-a="goal">'+opts([1,2,3,5,10,15,20].map(function(x){return[x,x+" ayat"]}),g)+'</select></label><label>Revise everything every<select data-a="cyc">'+opts([14,21,30,45,60].map(function(x){return[x,x+" days"]}),D.cfg.cycle)+'</select></label></div><p><button class="b" data-a="setup">Quick setup</button></p>';
return h}
function vMap(){var lg='<div class="legend">'+[["n","Not started"],["f","Fresh"],["d","Due soon"],["o","Needs revision"]].map(function(c){return'<span><i style="background:'+COL[c[0]]+'"></i>'+c[1]+'</span>'}).join("")+'</div>',full=0;
NJ.forEach(function(a){if(a.every(function(o){return segM(o)==o.tot}))full++});
var h=lg+'<p class="mut">'+full+' of 30 juz complete · '+total().toLocaleString()+' of '+ALL.toLocaleString()+' ayat. Tap a surah to edit it.</p><div class="jgrid">';
NJ.forEach(function(a,j){var m=0,t=0;a.forEach(function(o){m+=segM(o);t+=o.tot});var done=m==t,w=worst(a),n=a.length,cols=Math.min(n,Math.ceil(Math.sqrt(n)));
h+='<div class="jb'+(anim?" in":"")+(done?" full":"")+(CEL["j"+(j+1)]?" cel":"")+'" style="--i:'+j+(done&&(w=="d"||w=="o")?";border-color:"+COL[w]:"")+'"><div class="jh"><b>Juz '+(j+1)+'</b><span>'+(done?"✓":Math.round(m/t*100)+"%")+'</span></div><div class="cg" style="grid-template-columns:repeat('+cols+',1fr)">';
a.forEach(function(o){var mm=segM(o),w2=worst([o]),bg=mm==o.tot?COL[w2]:mm?"linear-gradient(to top,"+COL[w2]+" "+mm/o.tot*100+"%,#0a0f13 "+mm/o.tot*100+"%)":"";
h+='<button class="cl'+(mm==o.tot?" f":"")+(D.cur==o.sn?" cur":"")+(CEL["s"+o.k]?" cel":"")+'" data-a="seg" data-k="'+o.k+'"'+(bg?' style="background:'+bg+'"':"")+'>'+o.sn+'</button>'});
h+='</div></div>'});return h+'</div>'}
function ser(key){var a=[];for(var i=13;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);a.push([D[key][iso(d)]||0,"SMTWTFS".charAt(d.getDay())])}return a}
function bars(a,col,goal){var mx=Math.max.apply(null,a.map(function(x){return x[0]}).concat([goal||1])),s="";a.forEach(function(x,i){var h=x[0]/mx*56;s+='<rect x="'+(i*22+6)+'" y="'+(66-h)+'" width="16" height="'+Math.max(h,1)+'" rx="2" fill="'+(x[0]?col:"#1a222b")+'"/><text x="'+(i*22+14)+'" y="80" '+tx+' text-anchor="middle">'+x[1]+'</text>'});
if(goal){var y=66-goal/mx*56;s+='<line x1="0" x2="320" y1="'+y+'" y2="'+y+'" stroke="#5d6b78" stroke-dasharray="3 3" stroke-width=".7"/>'}return'<svg viewBox="0 0 320 84" width="100%">'+s+'</svg>'}
function dl(x){return new Date(x*864e5).toLocaleDateString(undefined,{day:"numeric",month:"short",timeZone:"UTC"})}
function vProg(){var tt=total(),ev=Object.keys(D.add).filter(function(k){return D.add[k]>0}).sort(),sa=0,W=320,H=120;ev.forEach(function(k){sa+=D.add[k]});
var c=tt-sa,st=c,x0=ev.length?num(ev[0]):T-1,x1=Math.max(T,x0+1),pts=[[0,c]];ev.forEach(function(k){c+=D.add[k];pts.push([(num(k)-x0)/(x1-x0),c])});pts.push([1,c]);
var y0=Math.max(0,Math.floor(st/10)*10),y1=Math.max(y0+10,Math.ceil(c/10)*10),P=pts.map(function(p){return(30+p[0]*(W-36)).toFixed(1)+","+(H-16-(p[1]-y0)/(y1-y0)*(H-26)).toFixed(1)}).join(" ");
var h='<h2>AYAT MEMORISED</h2><p class="msg">'+tt.toLocaleString()+' of '+ALL.toLocaleString()+' ayat ('+(tt/ALL*100).toFixed(1)+'%)</p><svg viewBox="0 0 '+W+' '+(H+4)+'" width="100%"><polygon points="30,'+(H-16)+' '+P+' '+(W-6)+','+(H-16)+'" fill="#a9d3f0" opacity=".1"/><polyline points="'+P+'" fill="none" stroke="#a9d3f0" stroke-width="1.6" stroke-linejoin="round"/><text x="0" y="14" '+tx+'>'+y1+'</text><text x="0" y="'+(H-14)+'" '+tx+'>'+y0+'</text><text x="30" y="'+(H+2)+'" '+tx+'>'+dl(x0)+'</text><text x="'+(W-6)+'" y="'+(H+2)+'" '+tx+' text-anchor="end">Today</text></svg>';
var r30=0;ev.forEach(function(k){if(T-num(k)<=30)r30+=D.add[k]});
if(r30>0){var dy=(ALL-tt)/(r30/30);h+='<p class="mut">At your pace over the last 30 days ('+(r30/30).toFixed(1)+' ayat a day): about '+(dy<700?Math.max(1,Math.round(dy/30))+" months":(dy/365).toFixed(1)+" years")+' to finish.</p>'}
var wn=0,wr=0;for(var i=0;i<7;i++){var d=new Date();d.setDate(d.getDate()-i);wn+=D.add[iso(d)]||0;wr+=D.rev[iso(d)]||0}
h+='<h2>NEW AYAT PER DAY</h2>'+bars(ser("add"),"#a9d3f0",D.cfg.goal)+'<p class="mut">'+wn+' new ayat this week</p><h2>AYAT REVISED PER DAY</h2>'+bars(ser("rev"),"#5fbf92")+'<p class="mut">'+wr+' ayat revised this week</p>';
var jb="";for(var j=1;j<=30;j++){var m=0,t=0;NJ[j-1].forEach(function(o){m+=segM(o);t+=o.tot});var x=(j-1)*10.5+3,hh=m/t*60;jb+='<rect x="'+x+'" y="4" width="8" height="60" rx="2" fill="#1a222b"/><rect x="'+x+'" y="'+(64-hh)+'" width="8" height="'+hh+'" rx="2" fill="#5fbf92"/>';if(j==1||j%5==0)jb+='<text x="'+(x+4)+'" y="76" '+tx+' text-anchor="middle">'+j+'</text>'}
return h+'<h2>EACH JUZ (BY AYAT)</h2><svg viewBox="0 0 320 80" width="100%">'+jb+'</svg>'}
function vOth(){var h='<p class="mut">Add hadith, duas, prose or poems. They join your revision once they are memorised.</p><div class="add"><input id="cn" placeholder="e.g. Hadith of intentions" autocomplete="off"><select id="ct">'+["Hadith","Dua","Prose","Poem","Other"].map(function(t){return"<option>"+t+"</option>"}).join("")+'</select><button class="b" data-a="addc">Add</button></div>';
D.cus.forEach(function(c){h+='<div class="row"><i style="background:'+(c.s==2?COL[fd(T-num(c.r))]:"#5d86a3")+'"></i><div class="t"><span>'+esc(c.name)+'</span><small>'+esc(c.t)+' · '+(c.s==2?"Memorised · revised "+(T-num(c.r))+"d ago":"Learning")+'</small></div>'+(c.s==2?'<button class="b" data-a="cr" data-k="'+c.k+'">Revised</button>':'<button class="b" data-a="cm" data-k="'+c.k+'">Memorised</button>')+'<button class="b" data-a="cd" data-k="'+c.k+'">×</button></div>'});return h}
function vSheet(k){var o=SEG.filter(function(x){return x.k==k})[0];if(!o)return"";var n=mem(o.sn),m=segM(o),c="";
for(var a=o.st;a<=o.en;a++){var f=a<=n;c+='<button class="ac'+(f?" f":"")+(a==n+1?" nx":"")+'" data-a="ay" data-s="'+o.sn+'" data-k="'+a+'"'+(f?' style="background:'+COL[fd(bago(o.sn,Math.floor((a-1)/BS)))]+'"':"")+'>'+a+'</button>'}
return'<div class="card" data-a="noop"><h3>'+esc(o.name)+(o.rng?" "+o.rng:"")+'</h3><small>'+m+' of '+o.tot+' ayat in this part · '+n+' of '+CNT[o.sn-1]+' in the surah</small><div class="ay">'+c+'</div><small>Tap an ayah to mark everything up to it as memorised. Tap the last filled one again to undo it. The outlined square is your next ayah.</small><div class="seg3"><label class="mut">Memorised up to ayah <input class="num" id="sn" type="number" inputmode="numeric" min="0" max="'+CNT[o.sn-1]+'" value="'+n+'"></label><button class="b on" data-a="save" data-s="'+o.sn+'">Save</button></div>'+(m?'<button class="b" data-a="srev" data-k="'+o.k+'">Revised today</button> ':"")+'<button class="b" data-a="scur" data-s="'+o.sn+'">Learn this surah</button> <button class="b" data-a="close">Close</button></div>'}
function applySetup(){var E=SU.f?(JS[SU.f]?gv(JS[SU.f][0],JS[SU.f][1])-1:ALL):0,fr=[],bkk=[],L=[],s;
for(s=1;s<=114;s++){var c0=CUM[s-1],fm=E>c0?Math.min(CNT[s-1],E-c0):0,bm=s>=SU.b?CNT[s-1]:0,n=Math.max(mem(s),fm,bm);if(n>mem(s)){D.mem[s]=n;(fm>=bm?fr:bkk).push(s)}}
bkk.reverse();fr.concat(bkk).forEach(function(s){blocks(s).forEach(function(b){if(!D.rv[bk(b.s,b.i)])L.push(b)})});
var cm=Math.min(SU.c||0,SU.l?CNT[SU.l-1]:0);if(SU.l){D.cur=SU.l;if(cm>mem(SU.l)){D.mem[SU.l]=cm;blocks(SU.l).forEach(function(b){if(!D.rv[bk(b.s,b.i)])L.push(b)})}}
L.forEach(function(b,i){var d=new Date();d.setDate(d.getDate()-Math.floor(D.cfg.cycle*.95*(1-i/L.length)));D.rv[bk(b.s,b.i)]=iso(d)});save()}
function vSetup(){var f=[[0,"None"]].concat(NJ.map(function(x,i){return[i+1,"Juz "+(i+1)]})),b=[[115,"None"]].concat(SO.slice().reverse()),l=[[0,"Nothing"]].concat(SO);
return'<div class="top"><button class="b" data-a="sback">← Back</button></div><h2>QUICK SETUP</h2><p class="mut">Tell the app what you already know. It only adds progress and never removes any. Revision dates are estimated, so fix them later by tapping a section on the map.</p><div class="set"><label>Memorised from the start through<select data-a="sf">'+opts(f,SU.f)+'</select></label><label>Memorised from An-Nas back to<select data-a="sb">'+opts(b,SU.b)+'</select></label><label>Currently learning<select data-a="sl">'+opts(l,SU.l)+'</select></label><label>Ayat of that surah already memorised<input class="num" id="sc" type="number" inputmode="numeric" min="0" value="'+SU.c+'"></label></div><p><button class="b on" data-a="apply">Apply</button></p>'}
function render(){document.getElementById("tabs").innerHTML=[["today","Today"],["map","Map"],["prog","Progress"],["oth","Other"]].map(function(t){return'<button data-a="tab" data-k="'+t[0]+'" class="'+(tab==t[0]?"on":"")+'">'+t[1]+'</button>'}).join("");
document.getElementById("v").innerHTML=(tab=="today"&&su?vSetup:({today:vToday,map:vMap,prog:vProg,oth:vOth})[tab])();
var sh=document.getElementById("sh"),old=sh.firstElementChild,st=old?old.scrollTop:0;sh.hidden=!sk;sh.innerHTML=sk?vSheet(sk):"";var nw=sh.firstElementChild;if(nw&&st)nw.scrollTop=st;anim=0;CEL={}}
function addC(){var i=document.getElementById("cn"),v=i&&i.value.trim();if(!v)return;D.cus.push({k:"c"+Date.now(),name:v,t:document.getElementById("ct").value,s:1});save();render()}
function cu(k){return D.cus.filter(function(c){return c.k==k})[0]}
document.addEventListener("click",function(e){if(/^(SELECT|INPUT|OPTION)$/.test(e.target.tagName))return;var t=e.target.closest("[data-a]");if(!t)return;var a=t.dataset.a,k=t.dataset.k,d=t.dataset;
if(a=="noop")return;
if(a=="tab"){tab=k;anim=(k=="map")}else if(a=="seg")sk=k;else if(a=="close")sk=null;
else if(a=="addv")chg(function(){addV(+d.n)});else if(a=="undo")undo();else if(a=="rv")doRow(+d.s,+d.x,+d.y,+d.r);
else if(a=="srev"){var o=SEG.filter(function(x){return x.k==k})[0];doRow(o.sn,o.st,o.st+segM(o)-1);sk=null}
else if(a=="save"){var s1=+d.s,v1=Math.max(0,Math.min(CNT[s1-1],+document.getElementById("sn").value||0));chg(function(){setMem(s1,v1)});sk=null}else if(a=="ay"){var s2=+d.s,a2=+k,pm=mem(s2);chg(function(){setMem(s2,a2==pm?a2-1:a2)})}
else if(a=="scur"){D.cur=+d.s;save();sk=null;tab="today"}
else if(a=="setup")su=1;else if(a=="sback")su=0;else if(a=="apply"){SU.c=+document.getElementById("sc").value||0;applySetup();su=0;tab="today"}
else if(a=="addc"){addC();return}else if(a=="cm"){var c=cu(k);c.s=2;c.m=TD;c.r=TD;tick();save()}else if(a=="cr"){cu(k).r=TD;tick();save()}else if(a=="cd"){D.cus=D.cus.filter(function(c){return c.k!=k});save()}
render()});
document.addEventListener("change",function(e){var a=e.target.dataset&&e.target.dataset.a,v=+e.target.value;
if(a=="sf")SU.f=v;else if(a=="sb")SU.b=v;else if(a=="sl")SU.l=v;else if(a=="cur"){D.cur=v;save();render()}else if(a=="goal"){D.cfg.goal=v;save();render()}else if(a=="cyc"){D.cfg.cycle=v;save();render()}});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="cn")addC()});
document.getElementById("date").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
render();
</script>
</body>
</html>
